[package]
name = "pygitx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cross-platform Git history access via Rust with a Python API"

[lib]
name = "pygitx_native"
crate-type = ["cdylib", "lib"]

[package.metadata.maturin]
include = ["python/pygitx"]
python-source = "python"

[features]
default = []
python-extension = ["pyo3/extension-module"]
python-tests = []

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py39"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4"

[dev-dependencies]
tempfile = "3.10"
